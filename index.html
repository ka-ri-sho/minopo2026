<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>みのぽ 2026 リーグ成績</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#172033;
      --muted:#687385;
      --line:#e3e8f0;
      --accent:#0b84ff;
      --accent2:#12b981;
      --danger:#ef4444;
      --warn:#f59e0b;
      --shadow:0 10px 28px rgba(20,40,70,.10);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.55;
    }
    header{
      position:sticky;
      top:0;
      z-index:20;
      background:linear-gradient(135deg,#0575ff,#08a6ff);
      color:#fff;
      padding:16px 16px 14px;
      box-shadow:0 6px 20px rgba(0,105,230,.20);
    }
    .head-inner{
      max-width:1080px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .title h1{
      font-size:22px;
      margin:0;
      letter-spacing:.02em;
    }
    .title p{margin:2px 0 0;font-size:12px;opacity:.9}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid rgba(255,255,255,.45);
      background:rgba(255,255,255,.15);
      color:#fff;
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      white-space:nowrap;
    }
    main{
      max-width:1080px;
      margin:0 auto;
      padding:16px 12px 64px;
    }
    .cards{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin:4px 0 14px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      min-width:0;
    }
    .metric-label{font-size:12px;color:var(--muted);margin-bottom:4px}
    .metric-value{font-size:23px;font-weight:800;letter-spacing:-.02em}
    .metric-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .tabs{
      display:flex;
      gap:8px;
      overflow:auto;
      padding:2px 0 10px;
      scrollbar-width:none;
      position:sticky;
      top:78px;
      z-index:15;
      background:linear-gradient(var(--bg) 70%, rgba(244,247,251,0));
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      background:#e8edf5;
      color:#314055;
      font-weight:700;
      white-space:nowrap;
      cursor:pointer;
    }
    .tab.active{
      background:#172033;
      color:#fff;
    }
    .toolbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:4px 0 12px;
    }
    input,select{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      border-radius:12px;
      padding:10px 12px;
      font-size:15px;
      min-height:42px;
    }
    input{flex:1;min-width:180px}
    select{min-width:150px}
    .section{display:none}
    .section.active{display:block}
    h2{
      margin:18px 0 10px;
      font-size:18px;
    }
    .table-wrap{
      overflow:auto;
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
    }
    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width:720px;
    }
    th,td{
      padding:10px 10px;
      border-bottom:1px solid var(--line);
      text-align:right;
      white-space:nowrap;
      font-size:14px;
    }
    th{
      position:sticky;
      top:0;
      background:#f7f9fc;
      color:#4d596b;
      font-size:12px;
      font-weight:800;
      z-index:1;
    }
    td:first-child,th:first-child{text-align:center}
    td:nth-child(2),th:nth-child(2){text-align:left}
    tr:last-child td{border-bottom:none}
    .rank-badge{
      display:inline-flex;
      width:28px;height:28px;
      align-items:center;justify-content:center;
      border-radius:50%;
      background:#edf2f7;
      color:#344054;
      font-weight:800;
      font-size:13px;
    }
    .rank-1{background:#ffe8a3;color:#7a4a00}
    .rank-2{background:#e5e7eb;color:#344054}
    .rank-3{background:#ffd2aa;color:#79350b}
    .pos{color:#047857;font-weight:800}
    .neg{color:#b91c1c;font-weight:800}
    .muted{color:var(--muted)}
    .player-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    .profile{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .big-card{
      grid-column:1/-1;
      background:linear-gradient(135deg,#172033,#314055);
      color:#fff;
      border:none;
    }
    .big-card .metric-label,.big-card .metric-sub{color:rgba(255,255,255,.72)}
    .chart{
      width:100%;
      height:260px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      box-shadow:var(--shadow);
      padding:10px;
      overflow:hidden;
    }
    .bar-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .bar-row{
      display:grid;
      grid-template-columns:86px 1fr 74px;
      gap:8px;
      align-items:center;
      font-size:13px;
    }
    .bar-name{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-weight:700;
    }
    .bar-track{
      height:12px;
      background:#edf2f7;
      border-radius:999px;
      overflow:hidden;
    }
    .bar-fill{
      height:100%;
      background:linear-gradient(90deg,#0b84ff,#12b981);
      border-radius:999px;
    }
    .note{
      margin:12px 0;
      padding:12px 14px;
      background:#fff8e6;
      border:1px solid #ffe1a6;
      color:#765100;
      border-radius:14px;
      font-size:13px;
    }
    .footer{
      margin-top:28px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }
    .empty{
      padding:24px;
      text-align:center;
      color:var(--muted);
    }

    #players .toolbar{
      align-items:center;
    }
    #players #playerSearch,
    #players #playerList{
      display:none;
    }
    #players #playerSelect{
      flex:1;
      width:100%;
      min-width:240px;
      font-weight:800;
      border:2px solid #dfe7f2;
      background:#fff;
      box-shadow:0 6px 18px rgba(20,40,70,.06);
    }
    .mobile-month-list{display:none}
    .month-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 8px 18px rgba(20,40,70,.07);
      padding:12px;
    }
    .month-card-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
    }
    .month-title{font-weight:900;font-size:15px}
    .month-stats{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    .month-stat-label{font-size:11px;color:var(--muted);margin-bottom:2px}
    .month-stat-value{font-weight:900;font-size:15px}

    html,body{width:100%;overflow-x:hidden}
    button,input,select{font:inherit;max-width:100%}
    @media (max-width:759px){
      header{padding:12px 12px 10px}
      .head-inner{align-items:flex-start;gap:8px}
      .title h1{font-size:18px;line-height:1.25}
      .title p{font-size:11px}
      .pill{font-size:11px;padding:6px 8px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
      main{padding:12px 10px 56px;overflow-x:hidden}
      .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .card{padding:12px;min-width:0}
      .metric-value{font-size:20px;word-break:break-word}
      .tabs{top:61px;margin-left:-10px;margin-right:-10px;padding:6px 10px 10px;background:linear-gradient(var(--bg) 78%, rgba(244,247,251,0))}
      .tab{padding:9px 12px;font-size:13px;flex:0 0 auto}
      .toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
      .toolbar input,.toolbar select{width:100%;min-width:0}
      #players .player-grid,
      #players .profile,
      #players .card,
      #players .chart,
      #players .table-wrap{min-width:0;max-width:100%}
      #players .toolbar{margin-bottom:10px}
      #players #playerSelect{min-width:0;min-height:48px;border-radius:16px;font-size:16px;padding:11px 14px}
      #players .profile{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      #players .big-card{grid-column:1/-1;padding:14px;background:linear-gradient(135deg,#172033,#263650)}
      #players .metric-value{font-size:18px;line-height:1.25;overflow-wrap:anywhere}
      #players .big-card .metric-value{font-size:26px}
      #players .metric-label{font-size:11px}
      #players .metric-sub{font-size:11px}
      #players h2{font-size:16px;margin:14px 0 8px}
      #players .chart{height:380px;overflow:visible}
      #players .table-wrap.player-month-table{display:none}
      #players .mobile-month-list{display:grid;gap:8px}
      #players .note{font-size:12px;margin-top:10px}
      #players .chart{height:390px;padding:8px;overflow:visible}
      #players .player-line-chart text{stroke-width:3px}
      #players table{min-width:0;table-layout:fixed}
      .bar-row{grid-template-columns:72px minmax(0,1fr) 64px;gap:6px}
    }
    @media (min-width:760px){
      header{padding:20px 20px 16px}
      .title h1{font-size:28px}
      main{padding:20px 18px 80px}
      .cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
      .profile{grid-template-columns:repeat(4,minmax(0,1fr))}
      .tabs{top:88px}
      .player-grid{grid-template-columns:1.1fr .9fr}
      .chart{height:320px}
    }
  </style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="title">
      <h1>🏆 みのぽ 2026 リーグ成績</h1>
      <p>閲覧専用ランキングビュー</p>
    </div>
    <div class="pill" id="latestPill">最新月</div>
  </div>
</header>

<main>
  <section class="cards" id="summaryCards"></section>

  <nav class="tabs" aria-label="画面切り替え">
    <button class="tab active" data-tab="overall">年間ランキング</button>
    <button class="tab" data-tab="monthly">月別ランキング</button>
    <button class="tab" data-tab="players">プレイヤー</button>
    <button class="tab" data-tab="top8">TOP8</button>
  </nav>

  <section class="section active" id="overall">
    <div class="toolbar">
      <input id="overallSearch" placeholder="プレイヤー名で検索" />
      <select id="overallSort">
        <option value="total">累積差枚数順</option>
        <option value="avg">平均差枚数順</option>
        <option value="points">順位ポイント順</option>
        <option value="top8">TOP8回数順</option>
        <option value="games">参加回数順</option>
      </select>
    </div>
    <div class="table-wrap"><table id="overallTable"></table></div>
  </section>

  <section class="section" id="monthly">
    <div class="toolbar">
      <select id="monthSelect"></select>
      <input id="monthlySearch" placeholder="プレイヤー名で検索" />
    </div>
    <div class="table-wrap"><table id="monthlyTable"></table></div>
  </section>

  <section class="section" id="players">
    <div class="toolbar">
      <input id="playerSearch" list="playerList" placeholder="プレイヤー名を入力・選択" />
      <datalist id="playerList"></datalist>
      <select id="playerSelect"></select>
    </div>
    <div id="playerDetail"></div>
  </section>

  <section class="section" id="top8">
    <div class="card">
      <h2 style="margin-top:0">TOP8ランキング</h2>
      <p class="muted" style="margin-top:-4px">8MAX卓で上位8位に入った回数・率を見る画面です。</p>
      <div class="bar-list" id="top8Bars"></div>
    </div>
    <h2>TOP8詳細</h2>
    <div class="table-wrap"><table id="top8Table"></table></div>
  </section>

  <div class="footer" id="footer"></div>
</main>

const rawData = window.LEAGUE_DATA;
const data = rawData.filter(r => r.status === "集計対象");
const months = [...new Set(data.map(r => r.ym))].sort();
const latestMonth = months[months.length - 1];

const fmt = new Intl.NumberFormat("ja-JP");
const pct = v => Number.isFinite(v) ? `${(v*100).toFixed(1)}%` : "-";
const ymLabel = ym => `20${ym.slice(0,2)}年${Number(ym.slice(2))}月`;
const signed = n => n > 0 ? `+${fmt.format(n)}` : fmt.format(n);
const clsDiff = n => n >= 0 ? "pos" : "neg";

function rankBadge(rank){
  const c = rank === 1 ? "rank-1" : rank === 2 ? "rank-2" : rank === 3 ? "rank-3" : "";
  return `<span class="rank-badge ${c}">${rank}</span>`;
}

function byPlayer(){
  const map = new Map();
  for(const r of data){
    if(!map.has(r.player)){
      map.set(r.player, {player:r.player,games:0,total:0,points:0,top3:0,top8:0,wins:0,bestRank:999,worstRank:0,months:[]});
    }
    const p = map.get(r.player);
    p.games += 1;
    p.total += r.diff;
    p.points += r.points;
    p.top3 += r.top3;
    p.top8 += r.top8;
    p.wins += r.rank === 1 ? 1 : 0;
    p.bestRank = Math.min(p.bestRank, r.rank);
    p.worstRank = Math.max(p.worstRank, r.rank);
    p.months.push(r);
  }
  return [...map.values()].map(p => ({
    ...p,
    avg: p.total / p.games,
    top8Rate: p.top8 / p.games,
    top3Rate: p.top3 / p.games
  }));
}

let players = byPlayer();

function table(el, headers, rows){
  const thead = `<thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`;
  const tbody = rows.length ? `<tbody>${rows.join("")}</tbody>` : `<tbody><tr><td colspan="${headers.length}" class="empty">該当データがありません</td></tr></tbody>`;
  document.getElementById(el).innerHTML = thead + tbody;
}

function renderSummary(){
  const latestRows = data.filter(r => r.ym === latestMonth).sort((a,b)=>a.rank-b.rank);
  const latestWinner = latestRows[0];
  const overall = [...players].sort((a,b)=>b.total-a.total)[0];
  const top8Leader = [...players].sort((a,b)=>b.top8-a.top8 || b.top8Rate-a.top8Rate || b.total-a.total)[0];
  const totalGames = data.length;
  document.getElementById("latestPill").textContent = `最新：${ymLabel(latestMonth)}`;
  document.getElementById("summaryCards").innerHTML = [
    ["最新月1位", latestWinner.player, `${ymLabel(latestMonth)} / ${signed(latestWinner.diff)}`],
    ["累積1位", overall.player, `${signed(overall.total)} / ${overall.games}回参加`],
    ["TOP8最多", top8Leader.player, `${top8Leader.top8}回 / TOP8率 ${pct(top8Leader.top8Rate)}`],
    ["登録成績", `${fmt.format(totalGames)}件`, `${months.length}か月分 / ${players.length}名`],
  ].map(([label,value,sub]) => `
    <div class="card">
      <div class="metric-label">${label}</div>
      <div class="metric-value">${value}</div>
      <div class="metric-sub">${sub}</div>
    </div>
  `).join("");
}

function renderOverall(){
  const q = document.getElementById("overallSearch").value.trim().toLowerCase();
  const sort = document.getElementById("overallSort").value;
  let arr = players.filter(p => p.player.toLowerCase().includes(q));
  const sorters = {
    total:(a,b)=>b.total-a.total,
    avg:(a,b)=>b.avg-a.avg,
    points:(a,b)=>b.points-a.points,
    top8:(a,b)=>b.top8-a.top8 || b.top8Rate-a.top8Rate || b.total-a.total,
    games:(a,b)=>b.games-a.games || b.total-a.total
  };
  arr.sort(sorters[sort]);
  table("overallTable",
    ["順位","プレイヤー","累積差枚数","平均差枚数","参加","最高位","1位","TOP3","TOP8","TOP8率","ポイント"],
    arr.map((p,i)=>`<tr>
      <td>${rankBadge(i+1)}</td>
      <td><strong>${p.player}</strong></td>
      <td class="${clsDiff(p.total)}">${signed(p.total)}</td>
      <td class="${clsDiff(p.avg)}">${signed(Math.round(p.avg))}</td>
      <td>${p.games}</td>
      <td>${p.bestRank}</td>
      <td>${p.wins}</td>
      <td>${p.top3}</td>
      <td>${p.top8}</td>
      <td>${pct(p.top8Rate)}</td>
      <td>${p.points}</td>
    </tr>`)
  );
}

function renderMonthly(){
  const month = document.getElementById("monthSelect").value || latestMonth;
  const q = document.getElementById("monthlySearch").value.trim().toLowerCase();
  const arr = data.filter(r => r.ym === month && r.player.toLowerCase().includes(q)).sort((a,b)=>a.rank-b.rank);
  table("monthlyTable",
    ["順位","プレイヤー","差枚数","残チップ","TOP3","TOP8","ポイント"],
    arr.map(r=>`<tr>
      <td>${rankBadge(r.rank)}</td>
      <td><strong>${r.player}</strong></td>
      <td class="${clsDiff(r.diff)}">${signed(r.diff)}</td>
      <td>${fmt.format(r.chips)}</td>
      <td>${r.top3 ? "○" : ""}</td>
      <td>${r.top8 ? "○" : ""}</td>
      <td>${r.points}</td>
    </tr>`)
  );
}

function cumulativeSeries(player){
  let total = 0;
  return months.map(m => {
    const r = data.find(x => x.ym === m && x.player === player);
    if(r) total += r.diff;
    return {ym:m, value:total, diff:r ? r.diff : null};
  });
}

function lineChart(series){
  // スマホで読める文字サイズを維持しつつ、上端で数値ラベルが切れないように
  // 上余白を大きめに取り、ラベル位置もグラフ内に収める。
  const w = 360;
  const h = 320;
  const padX = 30;
  const padTop = 68;
  const padBottom = 58;
  const axisFont = 19;
  const valueFont = 18;
  const pointRadius = 6;
  const valueOffset = 19;
  const minLabelY = 30;

  const vals = series.map(d=>d.value);
  let min = Math.min(0, ...vals), max = Math.max(0, ...vals);
  if(min === max){ min -= 100; max += 100; }

  // 最大値・最小値に余白を追加して、折れ線とラベルが端に寄りすぎないようにする
  const span = Math.max(1, max - min);
  min -= span * 0.16;
  max += span * 0.34;

  const plotW = w - padX * 2;
  const plotH = h - padTop - padBottom;
  const x = i => padX + plotW * (series.length<=1 ? 0.5 : i/(series.length-1));
  const y = v => padTop + plotH - plotH * ((v-min)/(max-min));
  const points = series.map((d,i)=>`${x(i)},${y(d.value)}`).join(" ");
  const zeroY = y(0);

  const labels = series.map((d,i)=>{
    const py = y(d.value);
    const labelY = Math.max(minLabelY, py - valueOffset);
    return `
      <text x="${x(i)}" y="${h-20}" text-anchor="middle" font-size="${axisFont}" font-weight="800" fill="#5d6878">${Number(d.ym.slice(2))}月</text>
      <circle cx="${x(i)}" cy="${py}" r="${pointRadius}" fill="#0b84ff"></circle>
      <text x="${x(i)}" y="${labelY}" text-anchor="middle" dominant-baseline="middle" font-size="${valueFont}" font-weight="900" fill="#111827">${signed(d.value)}</text>
    `;
  }).join("");

  return `<svg class="player-line-chart" viewBox="0 0 ${w} ${h}" width="100%" height="100%" role="img" aria-label="累積差枚数推移">
    <line x1="${padX}" x2="${w-padX}" y1="${zeroY}" y2="${zeroY}" stroke="#d7dee8" stroke-width="2" stroke-dasharray="5 5"></line>
    <polyline points="${points}" fill="none" stroke="#0b84ff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${labels}
  </svg>`;
}

function renderPlayerDetail(name){
  const p = players.find(x => x.player === name) || players.sort((a,b)=>b.total-a.total)[0];
  if(!p) return;
  document.getElementById("playerSearch").value = p.player;
  document.getElementById("playerSelect").value = p.player;
  const rows = [...p.months].sort((a,b)=>a.ym.localeCompare(b.ym));
  const series = cumulativeSeries(p.player);
  document.getElementById("playerDetail").innerHTML = `
    <div class="player-grid">
      <div>
        <div class="profile">
          <div class="card big-card">
            <div class="metric-label">プレイヤー</div>
            <div class="metric-value">${p.player}</div>
            <div class="metric-sub">累積差枚数 ${signed(p.total)}</div>
          </div>
          <div class="card"><div class="metric-label">参加回数</div><div class="metric-value">${p.games}</div><div class="metric-sub">登録月数ベース</div></div>
          <div class="card"><div class="metric-label">平均差枚数</div><div class="metric-value ${clsDiff(p.avg)}">${signed(Math.round(p.avg))}</div><div class="metric-sub">1回あたり</div></div>
          <div class="card"><div class="metric-label">最高順位</div><div class="metric-value">${p.bestRank}位</div><div class="metric-sub">月間1位 ${p.wins}回</div></div>
          <div class="card"><div class="metric-label">TOP8</div><div class="metric-value">${p.top8}回</div><div class="metric-sub">TOP8率 ${pct(p.top8Rate)}</div></div>
        </div>
        <h2>月別成績</h2>
        <div class="mobile-month-list" id="playerMonthCards"></div>
        <div class="table-wrap player-month-table"><table id="playerMonthlyTable"></table></div>
      </div>
      <div>
        <h2>累積推移</h2>
        <div class="chart">${lineChart(series)}</div>
        <div class="note">未参加月は累積差枚数を据え置きで表示しています。</div>
      </div>
    </div>`;
  table("playerMonthlyTable",
    ["年月","順位","差枚数","残チップ","TOP8"],
    rows.map(r=>`<tr>
      <td>${ymLabel(r.ym)}</td>
      <td>${rankBadge(r.rank)}</td>
      <td class="${clsDiff(r.diff)}">${signed(r.diff)}</td>
      <td>${fmt.format(r.chips)}</td>
      <td>${r.top8 ? "○" : ""}</td>
    </tr>`)
  );
  const monthCards = rows.map(r=>`<div class="month-card">
    <div class="month-card-head">
      <div class="month-title">${Number(r.ym.slice(2))}月</div>
      <div>${rankBadge(r.rank)}</div>
    </div>
    <div class="month-stats">
      <div><div class="month-stat-label">差枚数</div><div class="month-stat-value ${clsDiff(r.diff)}">${signed(r.diff)}</div></div>
      <div><div class="month-stat-label">残チップ</div><div class="month-stat-value">${fmt.format(r.chips)}</div></div>
      <div><div class="month-stat-label">TOP8</div><div class="month-stat-value">${r.top8 ? "○" : "-"}</div></div>
    </div>
  </div>`).join("");
  document.getElementById("playerMonthCards").innerHTML = monthCards;
}

function renderTop8(){
  const arr = [...players].sort((a,b)=>b.top8-a.top8 || b.top8Rate-a.top8Rate || b.total-a.total);
  const max = Math.max(1, ...arr.map(p=>p.top8));
  document.getElementById("top8Bars").innerHTML = arr.slice(0,12).map(p=>`
    <div class="bar-row">
      <div class="bar-name">${p.player}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${p.top8/max*100}%"></div></div>
      <div><strong>${p.top8}回</strong> <span class="muted">${pct(p.top8Rate)}</span></div>
    </div>
  `).join("");
  table("top8Table",
    ["順位","プレイヤー","TOP8回数","TOP8率","参加","累積差枚数","平均差枚数","最高位"],
    arr.map((p,i)=>`<tr>
      <td>${rankBadge(i+1)}</td>
      <td><strong>${p.player}</strong></td>
      <td>${p.top8}</td>
      <td>${pct(p.top8Rate)}</td>
      <td>${p.games}</td>
      <td class="${clsDiff(p.total)}">${signed(p.total)}</td>
      <td class="${clsDiff(p.avg)}">${signed(Math.round(p.avg))}</td>
      <td>${p.bestRank}</td>
    </tr>`)
  );
}

function setup(){
  const monthSelect = document.getElementById("monthSelect");
  monthSelect.innerHTML = months.slice().reverse().map(m=>`<option value="${m}">${ymLabel(m)}</option>`).join("");
  monthSelect.value = latestMonth;

  const playerNames = players.map(p=>p.player).sort((a,b)=>a.localeCompare(b,"ja"));
  document.getElementById("playerSelect").innerHTML = playerNames.map(n=>`<option value="${n}">${n}</option>`).join("");
  document.getElementById("playerList").innerHTML = playerNames.map(n=>`<option value="${n}">`).join("");

  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  document.getElementById("overallSearch").addEventListener("input", renderOverall);
  document.getElementById("overallSort").addEventListener("change", renderOverall);
  document.getElementById("monthSelect").addEventListener("change", renderMonthly);
  document.getElementById("monthlySearch").addEventListener("input", renderMonthly);

  document.getElementById("playerSelect").addEventListener("change", e => renderPlayerDetail(e.target.value));
  document.getElementById("playerSearch").addEventListener("change", e => {
    const val = e.target.value.trim();
    const found = players.find(p => p.player === val) || players.find(p => p.player.includes(val));
    if(found) renderPlayerDetail(found.player);
  });

  document.getElementById("footer").textContent = `データ範囲：${ymLabel(months[0])}〜${ymLabel(latestMonth)} / 集計対象のみ表示`;
  renderSummary();
  renderOverall();
  renderMonthly();
  renderTop8();
  renderPlayerDetail(players.sort((a,b)=>b.total-a.total)[0]?.player);
}
setup();
</script>
</body>
</html>
